services:
  postgres:
    image: postgres:16-alpine
    container_name: lazee-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lazee
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lazee"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
